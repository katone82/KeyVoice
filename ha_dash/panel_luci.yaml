views:
  - path: default_view
    title: Luci
    icon: mdi:lightbulb-group
    type: masonry

    cards:

      # ═══════════════════════════════════════
      # 🛋️ SALONE
      # ═══════════════════════════════════════

      - type: custom:stack-in-card

        card_mod:
          style: |
            ha-card {
              background: rgba(255, 193, 7, 0.10);
              border: 1px solid rgba(255, 193, 7, 0.45);
              border-radius: 24px;
              box-shadow: 0 0 25px rgba(255, 193, 7, 0.15);
              backdrop-filter: blur(12px);
              -webkit-backdrop-filter: blur(12px);
              overflow: hidden;
            }

        cards:

          # HEADER SALONE
          - type: custom:mushroom-template-card
            primary: "🛋️ SALONE"
            secondary: ""
            icon: mdi:sofa
            layout: horizontal
            fill_container: true

            card_mod:
              style: |
                ha-card {
                  background: rgba(255, 193, 7, 0.16);
                  border: none;
                  border-radius: 0;
                  box-shadow: none;
                }

                mushroom-shape-icon {
                  --shape-color: rgba(255, 193, 7, 0.25) !important;
                }

          # LIBRERIA (featured, resta come light-card grande)
          - type: custom:mushroom-light-card
            entity: light.luce_libreria
            name: Libreria
            icon: mdi:bookshelf
            show_brightness_control: true
            show_color_temp_control: false
            show_color_control: false
            collapsible_controls: true
            fill_container: true
            layout: horizontal
            secondary_info: state

            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  border-radius: 0;
                  box-shadow: none;
                }

          # TUTTE LE ALTRE ENTITÀ SALONE - PULSANTI
          - type: custom:auto-entities
            show_empty: false
            card_param: cards
            card:
              type: grid
              columns: 2
              square: false

            filter:
              include:
                - area: Salone
                  options:
                    type: tile
              exclude:
                - entity_id: light.luce_libreria

            sort:
              method: friendly_name
              ignore_case: true


